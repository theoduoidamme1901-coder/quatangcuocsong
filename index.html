<head>

<title>♥ Móc khóa ảnh – Acrylic, Cặp đôi, Polaroid, Chibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{color-scheme:dark;--black:#1f0b0e;--card:#3a181c;--red:#a50f2a;--red2:#6e0a1c;--gold:#cfa84a;--gold2:#efd38c;--ink:#fbf4ea;--mute:#dcc9b6;--line:#6b3a32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#2c1014 0,#1f0b0e 45%,#170709 100%) fixed;color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{background:#2a0d12;border-bottom:2px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.logo{font-size:22px;font-weight:700;color:var(--gold2);letter-spacing:1px}
nav{display:flex;gap:16px;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:14px}
nav a:hover{color:var(--gold2)}
.hero{text-align:center;padding:70px 0;background:radial-gradient(ellipse at 50% 0,var(--red) 0,var(--red2) 35%,var(--black) 80%);border-bottom:1px solid var(--gold)}
.hero h1{font-size:clamp(28px,5.5vw,50px);margin:0 0 10px;color:var(--gold2)}
.hero p{max-width:600px;margin:0 auto 22px;color:var(--ink)}
.btn{display:inline-block;background:var(--red);color:#fff;border:1px solid var(--gold);padding:10px 24px;border-radius:999px;font:600 15px system-ui,sans-serif;cursor:pointer}
.btn:hover{background:var(--gold);color:#000}
section{padding:46px 0;border-bottom:1px solid var(--line)}
section:nth-of-type(even){background-color:rgba(207,168,74,.06)}
h2{font-size:28px;margin:0 0 4px;text-align:center;color:var(--gold2)}
h2::after{content:"";display:block;width:70px;height:3px;margin:8px auto 24px;background:linear-gradient(90deg,var(--red),var(--gold))}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.card:hover{border-color:var(--gold)}
.m{aspect-ratio:1/1;background:linear-gradient(135deg,var(--red2),#000);display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden}
.m img,.m video,.m iframe{width:100%;height:100%;object-fit:cover;border:0}
.b{padding:12px 14px 16px}
.b h3{margin:0 0 4px;font-size:17px}
.b p{margin:0 0 8px;color:var(--mute);font:14px system-ui,sans-serif}
.price{color:var(--gold2);font-weight:700}
.ed{display:none}
body.edit .ed{display:flex}
.tools{gap:6px;padding:0 14px 12px;flex-wrap:wrap}
.tools button,.addp{background:#000;color:var(--gold2);border:1px solid var(--gold);border-radius:8px;padding:5px 10px;font:13px system-ui,sans-serif;cursor:pointer}
.addp{display:none;margin:18px auto 0}
body.edit .addp{display:block}
[contenteditable=true]{outline:1px dashed var(--gold);outline-offset:3px;cursor:text}
.contact{text-align:center}
.contact .big{font-size:22px;color:var(--gold2)}
footer{padding:24px 0 100px;text-align:center;color:var(--mute);font:13px system-ui,sans-serif}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#000;border:1px solid var(--gold);padding:8px 12px;border-radius:16px;display:flex;gap:8px;z-index:9;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 16px);box-shadow:0 4px 20px #000a}
#bar button{background:var(--red);color:#fff;border:1px solid var(--gold);border-radius:999px;padding:6px 12px;font:13px system-ui,sans-serif;cursor:pointer}
#bar button.on{background:var(--gold);color:#000}

section,.hero{position:relative;overflow:hidden}
section{background-image:var(--pat);background-size:160px}
section::before,section::after,.hero::before,.hero::after{content:"";position:absolute;width:280px;height:280px;background:var(--cluster) no-repeat center/contain;opacity:.5;pointer-events:none;z-index:0}
section::before,.hero::before{top:-40px;left:-40px}
section::after,.hero::after{bottom:-40px;right:-40px;transform:rotate(180deg)}
section:nth-of-type(even)::before{left:auto;right:-40px;transform:scaleX(-1)}
section:nth-of-type(even)::after{right:auto;left:-40px;transform:rotate(180deg) scaleX(-1)}
section>.wrap,.hero>.wrap{position:relative;z-index:1}

section::before,section::after,.hero::before,.hero::after{width:340px;height:340px;opacity:.85}

.hero h1{font-family:"Dancing Script","Playfair Display",Georgia,serif;font-weight:700;font-size:clamp(38px,8.5vw,70px);line-height:1.2;margin:0 0 14px;background:linear-gradient(180deg,#fff3c4 0,#e8c25a 55%,#b98a2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 6px #0009)}

h2,.logo,.b h3{font-family:"Playfair Display",Georgia,serif}
.hero{isolation:isolate;padding:90px 0}
.hero h1{white-space:nowrap;font-size:min(4.9vw,56px);text-align:center}
.hbg{position:absolute;inset:0;z-index:-2}
.hbg video,.hbg img{width:100%;height:100%;object-fit:cover;display:block}

body{background:radial-gradient(1200px 600px at 12% -5%,rgba(179,18,46,.55),transparent 60%),radial-gradient(900px 600px at 96% 38%,rgba(217,169,58,.16),transparent 60%),radial-gradient(1000px 700px at 4% 78%,rgba(160,14,40,.42),transparent 60%),linear-gradient(180deg,#0b0707,#1a0609 50%,#0b0707) fixed}
header{background:rgba(11,7,7,.82)}

.card:hover .b p{color:#fff2dc}
.contact .big:hover{text-shadow:0 0 12px rgba(243,217,138,.9)}
.logo{font-family:"Dancing Script","Playfair Display",Georgia,serif;font-size:32px;font-weight:700;letter-spacing:.5px;line-height:1.2;color:#f3d98a;text-shadow:0 0 12px rgba(217,169,58,.45),0 2px 4px rgba(0,0,0,.6)}
.rail{position:relative}
.rail .grid{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding:18px 10px 26px;margin:-10px 0 -6px;scrollbar-width:thin;scrollbar-color:#d9a93a transparent}
.rail .grid>.card{flex:0 0 230px;scroll-snap-align:start}
.rail .grid>p{flex:1 0 100%}
.rail .grid::-webkit-scrollbar{height:8px}
.rail .grid::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:8px}
.rail .grid::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#b3122e,#d9a93a);border-radius:8px}
.arr{position:absolute;top:calc(50% - 22px);width:40px;height:40px;border-radius:50%;border:1px solid var(--gold2);background:rgba(11,7,7,.88);color:var(--gold2);font-size:24px;line-height:1;cursor:pointer;z-index:4;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(217,169,58,.4);padding:0;transition:background .2s,color .2s}
.arr.l{left:-18px}.arr.r{right:-18px}
.arr:hover{background:var(--gold);color:#000}
@media (max-width:600px){.rail .grid>.card{flex-basis:200px}.arr{width:34px;height:34px;font-size:20px}.arr.l{left:-10px}.arr.r{right:-10px}}
header .wrap{max-width:1320px}
section>.wrap{position:relative;width:calc(100% - 28px);max-width:1320px;padding:36px 36px 40px;border:1px solid rgba(243,217,138,.85);border-radius:24px;background:linear-gradient(180deg,rgba(14,5,8,.62),rgba(44,8,18,.5));box-shadow:0 14px 38px rgba(0,0,0,.55),0 0 0 3px rgba(11,7,7,.7),0 0 0 4px rgba(217,169,58,.55),inset 0 0 0 1px rgba(243,217,138,.1)}
section>.wrap::before{content:"";position:absolute;inset:9px;border:1px solid rgba(243,217,138,.5);border-radius:16px;pointer-events:none}
section>.wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#f3d98a 3px,transparent 3.6px),radial-gradient(circle,#f3d98a 3px,transparent 3.6px),radial-gradient(circle,#f3d98a 3px,transparent 3.6px),radial-gradient(circle,#f3d98a 3px,transparent 3.6px);background-size:12px 12px;background-repeat:no-repeat;background-position:3px 3px,calc(100% - 3px) 3px,3px calc(100% - 3px),calc(100% - 3px) calc(100% - 3px)}
.hero.hasbg .hbg{max-width:1320px;width:calc(100% - 28px);border-color:rgba(243,217,138,.85);border-radius:24px;box-shadow:0 14px 38px rgba(0,0,0,.55),0 0 0 3px rgba(11,7,7,.7),0 0 0 4px rgba(217,169,58,.55);outline:0}
.hero.hasbg .snd{right:max(34px,calc((100% - 1320px)/2 + 20px))}
@media (max-width:600px){section>.wrap{width:calc(100% - 20px);padding:22px 14px 26px;border-radius:18px}section>.wrap::before{inset:6px;border-radius:13px}.hero.hasbg .hbg{width:calc(100% - 20px);border-radius:18px}.hero.hasbg .snd{right:22px}}
body{background:radial-gradient(1000px 520px at 50% -8%,rgba(150,14,38,.45),transparent 65%),linear-gradient(180deg,#120709,#1c0a0e 50%,#0e0507) fixed}
section>.wrap{background:linear-gradient(180deg,rgba(18,7,9,.93),rgba(34,9,15,.91))}
.card{background:linear-gradient(180deg,#fffaf0,#f6e3c2);border:1px solid #d9a93a;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.card .b{background:none}
.card .b h3{color:#3b0d15}
.card .b p{color:#6e4b3b}
.card .price{color:#a50f2a}
.m{background:linear-gradient(135deg,#f3e2c0,#e6cb97)}
.m::after{display:none}
.m img{-webkit-mask-image:none;mask-image:none;opacity:1}
.m video{opacity:1}
.tools{background:#2a0d12;padding-top:10px}
.card:hover,.card:focus-within{background:linear-gradient(180deg,#fffdf6,#ffefd0);border-color:#f3d98a;box-shadow:0 0 0 1px rgba(243,217,138,.85),0 0 30px rgba(243,200,90,.6),0 16px 36px rgba(0,0,0,.55)}
.card:hover .b h3{color:#a50f2a;text-shadow:none}
.card:hover .b p{color:#5a3a2c}
.card:hover .price{color:#c8102e;text-shadow:none}
.card:hover .m img,.card:hover .m video{filter:brightness(1.06) saturate(1.2)}

body::before{opacity:1}
section>.wrap{background:linear-gradient(180deg,rgba(18,7,9,.64),rgba(34,9,15,.6));-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#s2>.wrap{background:radial-gradient(ellipse at 18% 0,rgba(120,44,150,.5),transparent 60%),radial-gradient(ellipse at 88% 100%,rgba(150,10,62,.5),transparent 55%),linear-gradient(180deg,rgba(10,4,16,.88),rgba(24,6,22,.86));border-color:rgba(226,196,130,.85);box-shadow:0 14px 38px rgba(0,0,0,.6),0 0 42px rgba(130,60,190,.45),0 0 0 3px rgba(11,7,7,.7),0 0 0 4px rgba(190,150,240,.5)}

#s2 .card .b p{color:#cdb9e6}
#s2 .card .price{color:#f3d98a}
#s2 .m{background:radial-gradient(circle at 30% 25%,rgba(150,70,210,.55),transparent 60%),linear-gradient(135deg,#2a1030,#0e0512)}
#s2 .tools{background:#1a0a20}
#s2 .card:hover,#s2 .card:focus-within{background:linear-gradient(180deg,#3b1d45,#21102a);border-color:#e9d3ff;box-shadow:0 0 0 1px rgba(233,211,255,.8),0 0 34px rgba(170,110,255,.6),0 0 60px rgba(217,169,58,.25)}
#s2 .card:hover .b h3{color:#fff;text-shadow:0 0 10px rgba(200,160,255,.85)}
#s2 .card:hover .b p{color:#eadcf7}
#s2 .card:hover .price{color:#ffe9a8;text-shadow:0 0 10px rgba(243,217,138,.8)}
/* ===== VALENTINE · HỒNG CÁ TÍNH ===== */
:root{color-scheme:light;--k:#1a0010;--hot:#ff2d87;--pk:#ffd1e6;--black:#1a0010;--card:#fff;--line:#1a0010;--red:#e0116b;--red2:#b00a55;--gold:#ff2d87;--gold2:#ffd1e6;--ink:#fff;--mute:#7a3a55;
--cluster:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 340 340'><defs><path id='h' d='M0 14C-30 -6 -22 -30 -8 -28C-3 -27 0 -22 0 -19C0 -22 3 -27 8 -28C22 -30 30 -6 0 14Z' stroke='%231a0010' stroke-width='1.2' stroke-linejoin='round'/></defs><use href='%23h' fill='%23fff' transform='translate(110 120) scale(3.6) rotate(-14)'/><use href='%23h' fill='%231a0010' transform='translate(235 70) scale(2.2) rotate(14)'/><use href='%23h' fill='%23ffd1e6' transform='translate(70 255) scale(2) rotate(10)'/><use href='%23h' fill='%23ff2d87' transform='translate(205 225) scale(2.8) rotate(-8)'/><use href='%23h' fill='%23fff' transform='translate(295 160) scale(1.3) rotate(18)'/><g stroke='%23fff' stroke-width='4' stroke-linecap='round'><path d='M30 50v18M21 59h18'/><path d='M290 260v14M283 267h14'/><path d='M180 30v12M174 36h12'/></g></svg>");
--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'><defs><path id='h' d='M0 14C-30 -6 -22 -30 -8 -28C-3 -27 0 -22 0 -19C0 -22 3 -27 8 -28C22 -30 30 -6 0 14Z'/></defs><g fill='%23fff' fill-opacity='.22'><use href='%23h' transform='translate(40 45) scale(.9) rotate(-10)'/><use href='%23h' transform='translate(122 112) scale(.7) rotate(12)'/></g><circle cx='115' cy='30' r='2.5' fill='%23fff' fill-opacity='.35'/><circle cx='25' cy='125' r='2.5' fill='%23fff' fill-opacity='.35'/></svg>")}
body{background:radial-gradient(900px 500px at 12% -5%,#ffa3cf,transparent 60%),radial-gradient(800px 500px at 92% 42%,#ff6fb0,transparent 60%),linear-gradient(180deg,#ff72b0,#f0307f 55%,#d01468) fixed}
body::before{display:none}
#app header{background:var(--k);border-bottom:3px solid var(--hot);-webkit-backdrop-filter:none;backdrop-filter:none}
#app .logo{color:#fff;text-shadow:2px 2px 0 var(--hot)}
#app .logo:hover{color:var(--pk);text-shadow:2px 2px 0 #fff}
#app nav a{color:#fff;font-weight:600}
#app nav a:hover,#app nav a:focus-visible{color:#ff8cc0;text-shadow:none}
#app nav a::after{background:var(--hot);height:2px}
#app .hero{background:radial-gradient(circle at 50% 0,#ff8cc4 0,#f0307f 48%,#c4126a 100%);border-bottom:4px solid var(--k)}
#app .hero.hasbg{background:none;border-bottom:0}
#app .hero>.wrap::before{content:"♥ VALENTINE EDITION ♥";display:inline-block;background:var(--k);color:var(--pk);font:700 12px/1 system-ui,sans-serif;letter-spacing:2px;padding:8px 16px;border-radius:999px;transform:rotate(-3deg);margin-bottom:16px;box-shadow:3px 3px 0 var(--hot)}
#app .hero h1{background:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#fff;color:#fff;text-shadow:4px 4px 0 var(--k);filter:none;white-space:normal;font-size:clamp(34px,7vw,64px)}
#app .hero p{color:#fff;font-weight:600;text-shadow:1px 1px 0 rgba(26,0,16,.55)}
#app .btn{background:var(--k);color:#fff;border:3px solid var(--k);box-shadow:4px 4px 0 var(--hot);transition:transform .15s,box-shadow .15s}
#app .btn:hover{background:#fff;color:var(--k);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--k)}
#app .hero.hasbg .hbg{border:3px solid var(--k);border-radius:24px;box-shadow:8px 8px 0 var(--k);outline:0}

$("#bSecKf").onclick=()=>{S.sec.push({n:"Loại khung ảnh mới",fr:1,items:[{e:"🖼️",n:"Tên khung ảnh",d:"Mô tả ngắn",p:"Liên hệ"}]});save();render()}; $("#bSec").onclick=()=>{S.sec.push({n:"Nhóm sản phẩm mới",items:[{e:"🎁",n:"Tên sản phẩm",d:"Mô tả ngắn",p:"Liên hệ"}]});save();render()};
$("#bMedia").onclick=()=>pick(true,async fs=>{for(const f of fs){const id=uid();await putM(id,f);S.gal.push({id,ty:ty(f)})}save();render()});
$("#bYt").onclick=()=>{const u=prompt("Dán liên kết YouTube:");if(!u)return;const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(!m){alert("Không nhận ra liên kết YouTube.");return}S.gal.push({ty:"yt",y:m[1]});save();render()};
$("#bReset").onclick=()=>{if(!confirm("Xóa mọi chỉnh sửa, ảnh và video đã thêm?"))return;sf(()=>localStorage.removeItem(K));sf(()=>indexedDB.deleteDatabase("keychain-media"));location.reload()};
$("#bBg").onclick=()=>pick(false,async fs=>{const f=fs[0];if(!f)return;const id=uid();await putM(id,f);S.bg={id,ty:ty(f)};save();render();location.hash=""});
$("#bBgX").onclick=()=>{S.bg=null;save();render()};
$("#bExp").onclick=()=>{const o=JSON.parse(JSON.stringify(S));o.sec.forEach(s=>s.items.forEach(i=>{if(i.id){delete i.id;delete i.ty}}));o.gal=o.gal.filter(g=>g.ty==="yt"||g.src);if(o.bg&&o.bg.id)o.bg=null;const j=JSON.stringify(o);sf(()=>navigator.clipboard.writeText(j));prompt("Dữ liệu chữ đã chỉnh (ảnh nạp từ máy không được xuất, hãy dùng đường dẫn images/...). Nếu chưa tự sao chép, hãy copy đoạn này:",j)};
if(!OWN)$("#bar").style.display="none";
render();
/* trái tim bay lên như bọt khí khi rê chuột / chạm vào sản phẩm */
(()=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;let last=0;
const L=document.createElement("div");L.id="hl";document.body.appendChild(L);
const puff=(c,n)=>{if(L.childElementCount>80)return;const r=c.getBoundingClientRect(),P=2*(r.width+r.height);for(let i=0;i<n;i++){const h=document.createElement("span"),s=14+Math.random()*20,t=Math.random()*P,m=10;let x,y;
if(t<r.width){x=r.left+t;y=r.top}else if(t<r.width+r.height){x=r.right;y=r.top+t-r.width}else if(t<2*r.width+r.height){x=r.right-(t-r.width-r.height);y=r.bottom}else{x=r.left;y=r.bottom-(t-2*r.width-r.height)}
h.className="hb";h.textContent="♥";h.style.width=h.style.height=s+"px";h.style.fontSize=s*.55+"px";h.style.left=(x+Math.random()*2*m-m-s/2)+"px";h.style.top=(y+Math.random()*2*m-m-s/2)+"px";h.style.setProperty("--dx",(Math.random()*40-20)+"px");h.style.setProperty("--d",(1.4+Math.random()*1.2)+"s");h.addEventListener("animationend",()=>h.remove());L.appendChild(h)}};
const card=e=>e.target.closest&&e.target.closest("#app .card");
const burst=c=>{const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=Math.max(r.width,r.height)/2,G=["✦","✧","♥","✦","♡"],K=["#fff","#ffd1e6","#ffe08a","#ff8fb3"];for(let i=0;i<30;i++){const p=document.createElement("span"),a=i/30*6.283+Math.random()*.4,d=R*.9+30+Math.random()*90;p.className="sp";p.textContent=G[i%G.length];p.style.left=cx+"px";p.style.top=cy+"px";p.style.fontSize=(12+Math.random()*16)+"px";p.style.setProperty("--c",K[i%K.length]);p.style.setProperty("--tx",Math.cos(a)*d+"px");p.style.setProperty("--ty",Math.sin(a)*d+"px");p.style.setProperty("--d",(.7+Math.random()*.6)+"s");p.addEventListener("animationend",()=>p.remove());L.appendChild(p)}};
const PT=document.createElement("div");PT.id="petals";document.body.appendChild(PT);const petal=f=>{const p=document.createElement("span");p.className="pt";p.style.left=Math.random()*100+"vw";p.style.transform="scale("+(.7+Math.random()*.8)+")";p.style.setProperty("--sx",(Math.random()*160-80)+"px");p.style.setProperty("--d",(5+Math.random()*4)+"s");p.addEventListener("animationend",()=>p.remove());(f?L:PT).appendChild(p)};setInterval(()=>{if(PT.childElementCount<12&&!document.hidden)petal()},1300);
let SP=null;const closeSpot=()=>{if(!SP)return;const o=SP;SP=null;clearInterval(o._t);o.classList.remove("on");document.body.style.overflow="";setTimeout(()=>o.remove(),350)};
const spot=c=>{closeSpot();const o=document.createElement("div");o.id="spot";o.innerHTML='<div class="rays"></div><div class="box"></div><button class="x" aria-label="Đóng">✕</button>';const k=c.cloneNode(true);k.querySelectorAll(".tools,.hb").forEach(n=>n.remove());k.classList.remove("sel");k.removeAttribute("style");o.querySelector(".box").appendChild(k);o.querySelector(".box").insertAdjacentHTML("beforeend",'<a class="cta" href="#lh">♥ Liên hệ đặt hàng</a>');o.addEventListener("click",e=>{if(!e.target.closest(".card"))closeSpot()});document.body.appendChild(o);document.body.style.overflow="hidden";SP=o;requestAnimationFrame(()=>o.classList.add("on"));o._t=setInterval(()=>{puff(k,3);petal(true)},320);setTimeout(()=>burst(k),280)};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSpot()});
document.addEventListener("mouseover",e=>{const c=card(e);if(c&&!c.contains(e.relatedTarget))puff(c,24)});
document.addEventListener("mousemove",e=>{const c=card(e),t=Date.now();if(!c||t-last<120)return;last=t;puff(c,3)});
document.addEventListener("click",e=>{const c=card(e),clr=()=>document.querySelectorAll(".card.sel").forEach(x=>x.classList.remove("sel"));
if(!c){clr();document.body.classList.remove("hasSel");return}
puff(c,18);if(document.body.classList.contains("edit")||e.target.closest("button,a,[contenteditable=true]"))return;
spot(c)});
})();
</script>
